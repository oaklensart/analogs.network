<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ANALOGS.NETWORK — the ring: a wireframe torus with lit nodes.
       No filters (favicon renderers are picky); glow faked with halos. -->
  <rect width="64" height="64" fill="#000000"/>
  <g transform="rotate(-16 32 32)">
    <!-- torus: outer tube edge, centerline, inner tube edge -->
    <ellipse cx="32" cy="33" rx="26" ry="14.5" fill="none" stroke="#FF0000" stroke-width="1.6" opacity="0.75"/>
    <ellipse cx="32" cy="33" rx="20" ry="10.5" fill="none" stroke="#FF0000" stroke-width="1.2" opacity="0.4"/>
    <ellipse cx="32" cy="33" rx="14" ry="6.5"  fill="none" stroke="#FF0000" stroke-width="1"   opacity="0.25"/>
    <!-- lit nodes on the ring: origin white + discipline colors -->
    <circle cx="12.5" cy="24.5" r="5" fill="#FFFFFF" opacity="0.22"/>
    <circle cx="12.5" cy="24.5" r="2.6" fill="#FFFFFF"/>
    <circle cx="50"   cy="26"   r="4" fill="#00E6FF" opacity="0.25"/>
    <circle cx="50"   cy="26"   r="2" fill="#00E6FF"/>
    <circle cx="42"   cy="46"   r="4" fill="#FF00AA" opacity="0.25"/>
    <circle cx="42"   cy="46"   r="2" fill="#FF00AA"/>
    <circle cx="20"   cy="44.5" r="4" fill="#FFB400" opacity="0.25"/>
    <circle cx="20"   cy="44.5" r="2" fill="#FFB400"/>
  </g>
</svg>
