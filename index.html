<style>
/* ============================================================
   ANALOGS.NETWORK — pre-init placeholder
   One page. No dependencies. No build step. Minimal inline JS
   (ambient audio + the ring engine + rare whispers — page degrades
   to fully static without it).
   Palette (3): OLED black #000 · signal red #FF0000 · paper #E0E0E0
   ============================================================ */

:root {
  --black: #000000;
  --red: #FF0000;
  --white: #E0E0E0;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas,
               'Liberation Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--black);
  overflow: hidden;
}

body {
  font-family: var(--font-mono);
  color: var(--white);
  -webkit-font-smoothing: antialiased;
}

[hidden] { display: none !important; }

/* ---- ground: pure OLED black ---------------------------------
   No vignette, no grain (owner call, 2026-07-14): the ring and its
   light speak for themselves against absolute black. The floor is
   back (2026-07-14b) but as EMITTED LIGHT, not a wash — the engine
   paints it into the 1/4 bloom mip, so unlit ground stays #000 and
   the dither pass keeps the gradient band-free. */

/* ---- stage ------------------------------------------------ */

.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: calc(20px + env(safe-area-inset-top))
           calc(20px + env(safe-area-inset-right))
           calc(20px + env(safe-area-inset-bottom))
           calc(20px + env(safe-area-inset-left));
}

/* ---- corner brackets (terminal frame) ---------------------- */

.frame {
  position: absolute;
  inset: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
         max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  pointer-events: none;
}
.frame i {
  position: absolute;
  width: 22px; height: 22px;
  border: 0 solid rgba(255,0,0,0.8);
  filter: drop-shadow(0 0 6px rgba(255,0,0,0.5));
  animation: corner-breathe 7s ease-in-out infinite;
}
.frame i:nth-child(2) { animation-delay: -1.8s; }
.frame i:nth-child(3) { animation-delay: -3.5s; }
.frame i:nth-child(4) { animation-delay: -5.2s; }
@keyframes corner-breathe {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.45; }
}
.frame i:nth-child(1) { top: 0;    left: 0;  border-top-width: 1px; border-left-width: 1px; }
.frame i:nth-child(2) { top: 0;    right: 0; border-top-width: 1px; border-right-width: 1px; }
.frame i:nth-child(3) { bottom: 0; left: 0;  border-bottom-width: 1px; border-left-width: 1px; }
.frame i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }

/* ---- HUD readouts ------------------------------------------ */

.hud {
  position: absolute;
  font-size: 0.55rem;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(224,224,224,0.65);
  text-shadow: 0 0 6px rgba(255,255,255,0.15);
  white-space: nowrap;
  z-index: 3;
}
.hud .r { color: rgba(255,0,0,0.9); }
.hud-tl { top: calc(26px + env(safe-area-inset-top)); left: calc(30px + env(safe-area-inset-left)); }
.hud-tr { top: calc(26px + env(safe-area-inset-top)); right: calc(30px + env(safe-area-inset-right)); text-align: right; }
.hud-bl { bottom: calc(26px + env(safe-area-inset-bottom)); left: calc(30px + env(safe-area-inset-left)); }
.hud-br { bottom: calc(26px + env(safe-area-inset-bottom)); right: calc(30px + env(safe-area-inset-right)); text-align: right; }

@media (max-width: 560px) {
  .hud-tr, .hud-bl { display: none; }  /* keep phone corners quiet */
}

/* ---- the ring ------------------------------------------------ */
/* the wireframe torus, live on canvas — sockets dark, awaiting.
   Engine is a trimmed cut of demos/ring.html (same light pipeline). */

#ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* static fallback if the engine can't run: a whisper of the ring */
.ring-fallback {
  display: none;
  position: absolute;
  width: min(78vmin, 640px);
  aspect-ratio: 1.6;
  border-radius: 50%;
  border: 1px solid rgba(255,0,0,0.35);
  box-shadow: 0 0 40px rgba(255,0,0,0.15), inset 0 0 60px rgba(255,0,0,0.06);
  transform: rotate(-14deg);
  pointer-events: none;
}
.no-canvas .ring-fallback { display: block; }

/* ---- transmission whispers ----------------------------------- */

/* cryptic interference — the menu you left on too long. Flickers in,
   holds long enough to be read, then slowly melts into the red-black. */
.whisper {
  position: absolute;
  z-index: 1;
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255,60,60,0.8);
  text-shadow: 0 0 10px rgba(255,0,0,0.55);
  filter: blur(0.7px);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
}
.whisper.show { animation: whisper 9s linear forwards; }
@keyframes whisper {
  0%   { opacity: 0;    filter: blur(1.6px); }
  3%   { opacity: 0.95; filter: blur(0.6px); }
  6%   { opacity: 0.15; filter: blur(0.9px); }
  9%   { opacity: 0.85; filter: blur(0.6px); }
  13%  { opacity: 0.3;  filter: blur(0.9px); }
  17%  { opacity: 0.9;  filter: blur(0.6px); }
  45%  { opacity: 0.75; filter: blur(0.7px); }
  /* long decay: dim + defocus until it's just heat in the black */
  75%  { opacity: 0.32; filter: blur(1.4px); }
  100% { opacity: 0;    filter: blur(3.5px); }
}

/* ---- center message ----------------------------------------- */

/* the whole panel is one link now — the door to os.oaklens.art */
.msg {
  position: absolute;
  z-index: 2;
  display: block;
  text-align: center;
  text-decoration: none;
  color: inherit;
  padding: clamp(18px, 4vmin, 30px) clamp(22px, 5vmin, 44px);
  background: rgba(0,0,0,0.75);
  border: 1px solid rgba(255,0,0,0.3);
  box-shadow: 0 0 30px rgba(255,0,0,0.15), inset 0 0 20px rgba(255,0,0,0.05);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
.msg:hover, .msg:focus-visible {
  border-color: rgba(255,0,0,0.75);
  box-shadow: 0 0 45px rgba(255,0,0,0.3), inset 0 0 24px rgba(255,0,0,0.08);
  outline: none;
}
.msg:hover .sub, .msg:focus-visible .sub {
  color: var(--white);
  border-color: var(--red);
  text-shadow: 0 0 12px rgba(255,0,0,0.45);
}

/* glass catch-light along the panel's top edge */
.msg::before {
  content: '';
  position: absolute;
  top: 0; left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(90deg,
              transparent, rgba(255,255,255,0.28), transparent);
  pointer-events: none;
}

.msg h1 {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: clamp(1.05rem, 4.6vw, 1.75rem);
  letter-spacing: 0.34em;
  margin-right: -0.34em;   /* re-center tracked caps */
  color: var(--white);
  text-shadow: 0 0 22px rgba(255,0,0,0.4);
  white-space: nowrap;
}

/* trailing dots type themselves */
.msg h1 .dots {
  display: inline-block;
  width: 1.9em;
  text-align: left;
  vertical-align: bottom;
}
.msg h1 .dots::after {
  content: '...';
  display: inline-block;
  overflow: hidden;
  vertical-align: bottom;
  animation: dots 2.4s steps(4, jump-none) infinite;
}
@keyframes dots {
  from { width: 0; }
  to   { width: 1.9em; }
}

/* block cursor */
.msg h1 .cur {
  display: inline-block;
  width: 0.52em; height: 1em;
  margin-left: 0.14em;
  vertical-align: text-bottom;
  background: var(--red);
  box-shadow: 0 0 10px rgba(255,0,0,0.7);
  animation: blink 1.1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.msg .sub {
  display: inline-block;
  margin-top: 14px;
  font-size: clamp(0.58rem, 2.4vw, 0.72rem);
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: rgba(224,224,224,0.55);
  border-bottom: 1px solid rgba(255,0,0,0.35);
  padding-bottom: 3px;
  transition: color 0.25s ease, border-color 0.25s ease, text-shadow 0.25s ease;
}
.msg .sub .r { color: rgba(255,0,0,0.9); }

.msg .sub-addr {
  display: block;
  margin-top: 10px;
  font-size: clamp(0.5rem, 2vw, 0.62rem);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(224,224,224,0.35);
  transition: color 0.25s ease;
}
.msg:hover .sub-addr, .msg:focus-visible .sub-addr {
  color: rgba(224,224,224,0.6);
}

/* phone: tighten tracking + padding so the nowrap headline always fits */
@media (max-width: 560px) {
  .msg { padding: 15px 16px 17px; max-width: calc(100vw - 36px); }
  .msg h1 { font-size: clamp(0.78rem, 3.7vw, 1.2rem); letter-spacing: 0.2em; margin-right: -0.2em; }
  .msg .sub { letter-spacing: 0.18em; }
  .msg .sub-addr { letter-spacing: 0.16em; margin-top: 8px; }
}

/* ---- ambient audio HUD --------------------------------------- */

.audio-toggle {
  bottom: calc(20px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: none;
  border: 0;
  padding: 6px 10px;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: color 0.25s ease, text-shadow 0.25s ease;
}
.audio-toggle:hover, .audio-toggle:focus-visible {
  color: var(--white);
  text-shadow: 0 0 10px rgba(255,0,0,0.4);
}
.audio-toggle:focus-visible {
  outline: 1px solid rgba(255,0,0,0.6);
  outline-offset: 3px;
}

/* three-bar level meter — moves only while audio actually plays */
.audio-toggle .eq {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 9px;
}
.audio-toggle .eq i {
  width: 2px; height: 3px;
  background: var(--red);
  box-shadow: 0 0 4px rgba(255,0,0,0.6);
  opacity: 0.45;
}
.audio-toggle.on .eq i { opacity: 1; animation: eq 1.1s ease-in-out infinite alternate; }
.audio-toggle.on .eq i:nth-child(1) { animation-duration: 0.9s; }
.audio-toggle.on .eq i:nth-child(2) { animation-duration: 1.3s; animation-delay: -0.4s; }
.audio-toggle.on .eq i:nth-child(3) { animation-duration: 0.7s; animation-delay: -0.2s; }
@keyframes eq {
  from { height: 2px; }
  to   { height: 9px; }
}

/* attribution — CC BY-NC 4.0, quiet but present */
.hud-credit {
  bottom: calc(8px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.48rem;
  letter-spacing: 0.22em;
  color: rgba(224,224,224,0.28);
  text-shadow: none;
  text-decoration: none;
  transition: color 0.25s ease;
}
.hud-credit:hover, .hud-credit:focus-visible { color: rgba(224,224,224,0.7); }

@media (max-width: 560px) {
  .hud-credit .long { display: none; }
}

/* ---- motion off ---------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .msg h1 .dots::after, .msg h1 .cur,
  .frame i, .audio-toggle.on .eq i,
  .whisper.show { animation: none; }
  .msg h1 .dots::after { width: auto; }
  .whisper { display: none; }
}
</style>
</head>

  <script>
  /* assemble the address at runtime — Cloudflare's email obfuscation

     with an encoded blob that requires their decoder script. Building
     the address in JS keeps it out of the source entirely. */
  (function () {
    var u = 'themonitor', d = 'analogs.network';
    var a = u + '@' + d;
    var el = document.getElementById('msg-link');
    var sp = document.getElementById('tm-addr');
    if (el) el.href = 'mail' + 'to:' + a + '?subject=add%20me&body=my%20site%3A%20';
    if (sp) sp.textContent = (u + '@' + d).toUpperCase();
  })();
  </script>

</main>

<!--
  Ambient audio: "Ominous and Deep Ambience" by Resaural
  https://freesound.org/s/467026/ — License: Creative Commons 0 (No Attribution Required)
  Changes: transcoded to Ogg/Opus and AAC (.m4a) for web delivery under 1MB.
-->
<audio id="bgm" loop preload="auto">
  <source src="assets/audio/ambient-loop.ogg" type="audio/ogg; codecs=opus">
  <source src="assets/audio/ambient-loop.m4a" type="audio/mp4">
</audio>

<script>
(function () {
  var audio  = document.getElementById('bgm');
  var btn    = document.getElementById('audio-toggle');
  var credit = document.getElementById('audio-credit');
  var state  = document.getElementById('audio-state');
  var TARGET = 0.75;                 /* background thing — never full blast */
  var KEY    = 'analogs.audio';
  var fade   = null;

  btn.hidden = credit.hidden = false;   /* controls only exist if JS runs */

  function pref()    { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function setPref(v){ try { localStorage.setItem(KEY, v); } catch (e) {} }

  function setUI(mode) {              /* 'on' | 'off' | 'standby' */
    btn.classList.toggle('on', mode === 'on');
    state.textContent = mode.toUpperCase();
    btn.setAttribute('aria-pressed', mode === 'on' ? 'true' : 'false');
  }

  function fadeTo(target, ms, then) {
    if (fade) cancelAnimationFrame(fade);
    var from = audio.volume, t0 = performance.now();
    (function step(t) {
      var k = Math.min(1, (t - t0) / ms);
      audio.volume = from + (target - from) * k;
      if (k < 1) fade = requestAnimationFrame(step);
      else if (then) then();
    })(t0);
  }

  function start() {
    if (fade) cancelAnimationFrame(fade);
    audio.volume = 0;
    var p = audio.play();
    if (p && p.then) p.then(function () {
      disarm();
      setUI('on');
      fadeTo(TARGET, 3500);
    }).catch(function () {            /* autoplay blocked: first gesture starts it */
      setUI('standby');
      arm();
    });
  }

  function stop() {
    setUI('off');
    fadeTo(0, 600, function () { audio.pause(); });
  }

  function kick(e) {
    if (e.target && btn.contains(e.target)) return;   /* toggle handles itself */
    disarm();
    start();
  }
  function arm()    { addEventListener('pointerdown', kick); addEventListener('keydown', kick); }
  function disarm() { removeEventListener('pointerdown', kick); removeEventListener('keydown', kick); }

  btn.addEventListener('click', function () {
    if (audio.paused) { setPref('on'); start(); }
    else              { setPref('off'); disarm(); stop(); }
  });

  if (pref() === 'off') setUI('off');   /* respect a visitor who turned it off */
  else start();
})();

/* ---- late-night broadcast anomalies ---------------------------
   Random, subtle: cryptic transmissions surface in the dark. The
   kind of thing a DVD menu does when nobody's been watching for a
   while — and the longer you leave it on, the weirder it gets:
   whispers come more often, and stranger messages unlock deeper
   into the session. */
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var whisper = document.getElementById('whisper');

  /* ordered mild → weird; later lines only surface deeper into the session */
  var MSGS = [
    'HANDSHAKE INCOMPLETE // RETRYING',
    'SIGNAL BLEED DETECTED',
    'CARRIER LOST. CARRIER FOUND.',
    'UPLINK DREAMING',
    '37.8044 N / 122.2712 W',
    'ARE YOU STILL THERE?',
    'DO NOT ADJUST YOUR TERMINAL',
    'ECHO OF NODE 000',
    'THE NETWORK REMEMBERS YOU',
    'SOMEONE ELSE IS ON THIS FREQUENCY',
    'IT IS WARM INSIDE THE SIGNAL',
    'WE NEVER STOPPED BROADCASTING',
    'NODE 000 IS AWAKE',
    'YOUR ORBIT IS DECAYING TOO'
  ];

  var T0 = performance.now();
  var lastMsg = -1;

  function rand(a, b) { return a + Math.random() * (b - a); }
  /* weirdness: 0 at load → 1 after ~10 minutes on screen */
  function weird() { return Math.min(1, (performance.now() - T0) / 600000); }

  /* whisper: one cryptic line, flickering in a quiet corner */
  whisper.addEventListener('animationend', function () {
    whisper.classList.remove('show');
  });
  (function whisperLoop() {
    setTimeout(function () {
      /* the pool deepens with weirdness; never repeat the last line */
      var unlocked = Math.max(6, Math.ceil(MSGS.length * (0.4 + 0.6 * weird())));
      var i;
      do { i = Math.floor(Math.random() * unlocked); } while (i === lastMsg);
      lastMsg = i;
      whisper.textContent = MSGS[i];
      whisper.style.left = (Math.random() < 0.5 ? rand(6, 24) : rand(58, 74)) + '%';
      whisper.style.top  = (Math.random() < 0.5 ? rand(12, 30) : rand(68, 84)) + '%';
      whisper.classList.add('show');
      whisperLoop();
    }, rand(22000, 60000) * (1 - 0.6 * weird()));
  })();
})();

/* ---- THE RING -------------------------------------------------
   The wireframe torus, live. A trimmed cut of the ring engine:
   emissive buffer + filter-free mip-chain bloom, mip-res floor
   catch + dither, reactive dust, vessel guides, frame governor.
   Pre-launch state: every socket dark but one —
   node 000 burns at the origin — while a survey packet laps the
   coil, testing the line in each discipline's color.
   Degrades: no canvas → CSS fallback ring; reduced motion →
   one static frame; hidden tab → paused. */
(function () {
  var canvas = document.getElementById('ring');
  /* alpha:false — the ground is opaque black every frame; an opaque
     backing store lets WebKit/Gecko skip the page-compositing blend */
  var mctx = canvas.getContext && canvas.getContext('2d', { alpha: false });
  if (!mctx) { document.body.classList.add('no-canvas'); return; }

  var TAU = Math.PI * 2;
  var SOCKETS = 132, WINDINGS = 9.7, TUBE = 0.30, TILT = 0.84, PERSP = 1700;
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── presentation profile (2026-07-16) ─────────────────────
     The LOOK is a deliberate choice by device class — never the
     governor's. LEAN is the phone look (owner call): thin jewel
     lines on OLED black — quiet halos, no room-glow wash, dither
     nearly off, and a RAISED depth floor (without the wide bloom
     to catch it, the stock depth curve drops the far rim into
     pure black and the torus dissolves — when the bloom comes
     down, the curve must come up). FULL is the desktop look.
     Test overrides: ?look=lean|full · ?tier=0..6 (locks the
     governor); both also read from the #hash. */
  function qparam(k) {
    try {

      var zs = 0;
      for (var s2 = 0; s2 <= RUN; s2++) {
        /* no wrap: WINDINGS is non-integer, so t=1 !== t=0 — a modulo
           here draws a seam chord across the whole shape */
        helix(Math.min(1, (k + s2) / SAMPLES), cosS, sinS, cosT, sinT);
        if (s2 === 0) ectx.moveTo(out.sx, out.sy); else ectx.lineTo(out.sx, out.sy);
        zs += out.z;
      }
      depth = Math.max(0, (ZM - zs / (RUN + 1)) / (2 * ZM));
      var da = depthA(0.14, 0.86, depth);
      /* far side sinks toward deep desaturated red — atmosphere, not
         just fade (the fiber-optic white→warm falloff, reversed) */
      var emberC = mix(FARRED, RED, Math.min(1, depth * 1.35));
      var cc = heat > 0.01 ? mix(emberC, cycleCur, heat) : emberC;
      var a1 = da * (0.17 + heat * 0.5);
      var a2 = da * (0.46 + heat * 0.6);
      ectx.strokeStyle = col(cc, a1);
      ectx.lineWidth = (1.6 + heat * 1.6) * out.scale;
      ectx.stroke();
      ectx.strokeStyle = col(heat > 0.5 ? mix(cc, WHITE, (heat - 0.5) * 0.8) : cc, a2);
      ectx.lineWidth = (0.55 + heat * 0.45) * out.scale;
      ectx.stroke();
    }

    /* the packet head — a continuous stroke along the same helix as
       the coil, long enough to bridge the trail's segment grid, so
       head and trail read as one unbroken filament */
    if (!REDUCED) {
      var HEAD = 12, SPAN = 0.016;
      ectx.beginPath();
      for (k = 0; k <= HEAD; k++) {
        var tt = pkt - (k / HEAD) * SPAN; if (tt < 0) tt += 1;
        helix(tt, cosS, sinS, cosT, sinT);
        if (k === 0) ectx.moveTo(out.sx, out.sy); else ectx.lineTo(out.sx, out.sy);
      }
      ectx.strokeStyle = col(cycleCur, 0.45);
      ectx.lineWidth = 3.2 * out.scale;
      ectx.stroke();
      ectx.strokeStyle = col(mix(cycleCur, WHITE, 0.75), 0.95);
      ectx.lineWidth = 1.1 * out.scale;
      ectx.stroke();
      /* hot tip, sitting exactly on the filament's end */
      helix(pkt, cosS, sinS, cosT, sinT);
      ectx.fillStyle = col(mix(cycleCur, WHITE, 0.85), 0.95);
      ectx.beginPath();
      ectx.arc(out.sx, out.sy, 1.8 * out.scale, 0, TAU);
      ectx.fill();
      headX = out.sx; headY = out.sy;      /* light source for the dust */
    }

    /* sockets: dark seats, the odd hopeful flicker; merged members
       burn in their discipline color (lit by the registry data
       island), node 000 white at the origin */
    for (k = 0; k < SOCKETS; k++) {
      var so = sockets[k];
      so.flash *= Math.pow(0.05, dt);
      var ring2 = 1 + TUBE * Math.cos(so.phi);
      project(ring2 * Math.cos(so.theta), ring2 * Math.sin(so.theta), TUBE * Math.sin(so.phi), cosS, sinS, cosT, sinT);
      depth = Math.max(NODE_DFLOOR, (ZM - out.z) / (2 * ZM));
      if (so.lit) {
        var pulse = 0.85 + 0.15 * Math.sin(now * 0.002 + so.tw);
        var gr = (so.lit.white ? 26 : 17) * out.scale * pulse;
        ectx.globalAlpha = 0.9 * depth + 0.1;
        ectx.drawImage(so.lit.sprite, out.sx - gr, out.sy - gr, gr * 2, gr * 2);
        ectx.globalAlpha = 1;
        ectx.fillStyle = so.lit.white ? col(WHITE, 0.95) : col(mix(so.lit.c, WHITE, 0.55), 0.95);
        ectx.beginPath();
        ectx.arc(out.sx, out.sy, (so.lit.white ? 1.7 : 1.4) * out.scale, 0, TAU);
        ectx.fill();
        if (so.lit.white) { orgX = out.sx; orgY = out.sy; }  /* second light source */
      } else {
        var fa = (0.15 + 0.07 * Math.sin(now * 0.0012 + so.tw) + so.flash * 0.85) * depth;
        if (fa > 0.02) {
          ectx.fillStyle = col(so.flash > 0.2 ? mix(RED, WHITE, so.flash * 0.6) : RED, fa);
          ectx.beginPath();
          ectx.arc(out.sx, out.sy, (0.9 + so.flash * 1.2) * out.scale, 0, TAU);
          ectx.fill();
        }
      }
    }

    /* dust — reacts to the two live light sources (packet head + origin):
       squared-distance falloff, no sqrt. Lit motes flare, scale, and
       tint toward the light; dim motes batch into three Path2D alpha
       buckets so the whole field costs a handful of fill calls. */
    var buckets = [null, null, null];
    var BUCKET_A = [0.022, 0.045, 0.075];
    var pr2 = (RMAJ * 0.32) * (RMAJ * 0.32);
    var or2 = pr2 * 0.35;
    for (k = 0; k < motes.length; k += Q.moteStride) {
      var mo = motes[k];
      if (!REDUCED) { mo.theta += 0.00005; mo.tw += mo.tws * dt; }
      var r3 = 1 + TUBE * Math.cos(mo.phi);
      project(r3 * Math.cos(mo.theta) + mo.ox, r3 * Math.sin(mo.theta) + mo.oy,
              TUBE * Math.sin(mo.phi) + mo.oz, cosS, sinS, cosT, sinT);
      depth = Math.max(0, (ZM - out.z) / (2 * ZM));
      /* fake bokeh — circle of confusion by depth. Points of light
         off the focal plane (the near rim, where the eye lives)
         spread into bigger, dimmer discs; the bloom rounds their
         edge. Costs a couple of muls per mote, no extra buffers.
         ONLY the dust defocuses — the subject stays tack sharp. */
      var coc = BOKEH * Math.min(1, Math.abs(out.z + RMAJ * 0.65) / (RMAJ * 1.6));
      var bk = 1 + 1.8 * coc;
      var tw2 = 0.5 + 0.5 * Math.sin(mo.tw);
      var ma = (0.03 + 0.05 * tw2) * depth / (bk * Math.sqrt(bk));
      var boost = 0;
      if (!REDUCED) {
        var dx = out.sx - headX, dy = out.sy - headY;
        boost = 0.6 / (1 + (dx * dx + dy * dy) / pr2);
        dx = out.sx - orgX; dy = out.sy - orgY;
        boost += 0.35 / (1 + (dx * dx + dy * dy) / or2);
      }
      if (boost > 0.04) {
        ma += boost * (0.5 + 0.5 * tw2);
        ectx.fillStyle = col(mix(DUST, cycleCur, Math.min(1, boost * 1.6)), Math.min(0.8, ma));
        ectx.beginPath();
        ectx.arc(out.sx, out.sy, (0.45 + boost * 1.0) * out.scale * bk, 0, TAU);
        ectx.fill();
      } else if (ma >= 0.012) {
        var bi = ma < 0.034 ? 0 : (ma < 0.058 ? 1 : 2);
        if (!buckets[bi]) buckets[bi] = new Path2D();
        var mr = 0.5 * out.scale * bk;
        buckets[bi].moveTo(out.sx + mr, out.sy);
        buckets[bi].arc(out.sx, out.sy, mr, 0, TAU);
      }
    }
    for (k = 0; k < 3; k++) {
      if (buckets[k]) {
        ectx.fillStyle = col(DUST, BUCKET_A[k]);
        ectx.fill(buckets[k]);
      }
    }
    ectx.globalCompositeOperation = 'source-over';

    /* composite: pure black ground + emissive + bloom */
    mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    mctx.fillStyle = '#000';                 /* opaque black: 'overlay'
                                                dither stays neutral here */
    mctx.fillRect(0, 0, W, H);

    mctx.globalCompositeOperation = 'lighter';
    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.drawImage(em, 0, 0);

    /* ping-pong bloom: successive half-step downscales; hardware
       bilinear filtering IS the blur (each halving is a proper 2×2
       box average — never skip levels or it undersamples and
       shimmers). No ctx.filter anywhere: identical output on
       Chromium, WebKit, and Gecko.
       Tier ④/⑤ bloom stride: rebuild the chain (+floor+dither) every
       Nth frame and reuse it between — halos change slowly, the sharp
       emissive stays per-frame. REDUCED renders always rebuild (a
       still must be complete). */
    if (REDUCED || (bloomTick++ % Q.bloomStride) === 0) {
      var src = em;
      var levels = (Q.wideBloom && MIP_A[2] > 0) ? mips.length : mips.length - 1;
      for (k = 0; k < levels; k++) {
        mips[k].x.clearRect(0, 0, mips[k].c.width, mips[k].c.height);
        mips[k].x.drawImage(src, 0, 0, mips[k].c.width, mips[k].c.height);
        src = mips[k].c;
      }

      /* the floor — the room catches the packet's light. Painted into
         the 1/4 mip AFTER the chain is built (so it never compounds
         into the deeper mips) and BEFORE the dither (so the noise
         grains it too): 1/16 the pixels of a full-res fill, and the
         bilinear upscale keeps the falloff liquid. Unlit ground stays
         absolute #000 — this is light landing on the floor, not a
         background wash. Alphas are 2x the retired full-res floor
         because mip 0 composites at 0.5. */
      var fx = mips[0].x, fw = mips[0].c.width, fh = mips[0].c.height;
      var fq = ((floorCur.r >> 3) << 10) | ((floorCur.g >> 3) << 5) | (floorCur.b >> 3);
      if (fq !== floorKey || fw !== floorW) { bakeFloor(fw, fh); floorKey = fq; floorW = fw; }
      fx.globalCompositeOperation = 'lighter';
      /* the band's hot zone lives at its bottom edge; LEAN slides the
         band so that zone straddles the ring's bottom rim instead of
         hiding behind the bottom UI */
      var fbot = LEAN ? Math.min(1, FLOORB + 0.12) : 1;
      fx.drawImage(floorSpr, 0, fh * (fbot - 0.72), fw, fh * 0.72);
      fx.globalCompositeOperation = 'source-over';

      /* temporal dither, applied AT MIP RESOLUTION (1/16 the pixels of
         a full-res pass): the bloom halos are where 8-bit banding
         lives, gray noise is neutral on black, and the bilinear
         upscale melts the jitter into film-grain-scale texture. */
      var dx1 = mips[0].x;
      var mw = mips[0].c.width, mh = mips[0].c.height;
      var sw = Math.min(NOISE_S, mw), sh = Math.min(NOISE_S, mh);
      /* source-atop clips the noise to pixels that GLOW — 'overlay'
         bleeds onto the transparent regions and grays the pure black */
      dx1.globalCompositeOperation = 'source-atop';
      dx1.globalAlpha = DITHER_A;
      dx1.drawImage(noise,
        (Math.random() * (NOISE_S - sw)) | 0, (Math.random() * (NOISE_S - sh)) | 0,
        sw, sh, 0, 0, mw, mh);
      dx1.globalAlpha = 1;
      dx1.globalCompositeOperation = 'source-over';
    }

    mctx.globalAlpha = MIP_A[0];
    mctx.drawImage(mips[0].c, 0, 0, canvas.width, canvas.height);   /* 1/4 — neon halo */
    mctx.globalAlpha = MIP_A[1];
    mctx.drawImage(mips[2].c, 0, 0, canvas.width, canvas.height);   /* 1/16 — soft scatter */
    if (Q.wideBloom && MIP_A[2] > 0) {
      mctx.globalAlpha = MIP_A[2];
      mctx.drawImage(mips[3].c, 0, 0, canvas.width, canvas.height); /* 1/32 — room glow */
    }

    mctx.globalAlpha = 1;
    mctx.globalCompositeOperation = 'source-over';

    gov.lastW = (performance.now() - w0) / 1000;   /* this frame's CPU work */
  }

  document.addEventListener('visibilitychange', function () {
    if (REDUCED) return;
    if (document.hidden) running = false;
    else if (!running) { running = true; lastT = performance.now(); requestAnimationFrame(frame); }
  });

  /* ---- the data island -----------------------------------------
     Git is the database: the registry (nodes/*.json) compiles to
     manifest.json in CI, and the page fetches it to light the
     merged sockets + drive the NODES count. Offline / file:// the
     fetch fails and the inline seed keeps the pre-launch look —
     the page never depends on the network to render. */
  var DISC_NAMES = ['Photography', 'Digital Art', 'Writing', 'Code',
                    'Music', 'Design', 'Architecture'];
  var litSprites = { origin: originGlow };
  function applyRegistry(list) {
    var i, count = 0;
    for (i = 0; i < SOCKETS; i++) sockets[i].lit = null;
    for (i = 0; i < list.length; i++) {
      var n = list[i];
      if (!n || typeof n.node !== 'number' || n.status !== 'online') continue;
      count++;
      var so = sockets[((n.node % SOCKETS) + SOCKETS) % SOCKETS];
      var di = DISC_NAMES.indexOf(n.disciplines && n.disciplines[0]);
      var c = di >= 0 ? CATS[di] : RED;
      var key = n.node === 0 ? 'origin' : String(di);
      if (!litSprites[key]) litSprites[key] = glowSprite(mix(c, WHITE, 0.15));
      so.lit = { c: c, sprite: litSprites[key], white: n.node === 0 };
    }
    var cnt = document.getElementById('node-count');
    if (cnt) cnt.textContent = String(count).padStart(3, '0');
    if (REDUCED) frame(performance.now());   /* re-render the still */
  }
  /* inline seed — node 000 always burns, even with no network */
  applyRegistry([{ node: 0, disciplines: ['Photography'], status: 'online' }]);
  try {
    fetch('manifest.json').then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) { if (m && m.nodes && m.nodes.length) applyRegistry(m.nodes); })
      .catch(function () {});
  } catch (e) {}

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
