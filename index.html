<style>
/* ============================================================
   ANALOGS.NETWORK — pre-init placeholder
   One page. No dependencies. No build step. No JavaScript.
   Palette (3): OLED black #000 · signal red #FF0000 · paper #E0E0E0
   ============================================================ */

:root {
  --black: #000000;
  --red: #FF0000;
  --white: #E0E0E0;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas,
               'Liberation Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--black);
  overflow: hidden;
}

body {
  font-family: var(--font-mono);
  color: var(--white);
  -webkit-font-smoothing: antialiased;
}

/* ---- stage ------------------------------------------------ */

.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: calc(20px + env(safe-area-inset-top))
           calc(20px + env(safe-area-inset-right))
           calc(20px + env(safe-area-inset-bottom))
           calc(20px + env(safe-area-inset-left));
}

/* faint red floor-glow, bottom of the void */
.stage::before {
  content: '';
  position: absolute;
  left: 50%; bottom: -32vh;
  width: 130vw; height: 60vh;
  transform: translateX(-50%);
  background: radial-gradient(ellipse closest-side,
              rgba(255,0,0,0.10), rgba(255,0,0,0.035) 45%, transparent 72%);
  pointer-events: none;
}

/* ---- corner brackets (terminal frame) ---------------------- */

.frame {
  position: absolute;
  inset: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
         max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  pointer-events: none;
}
.frame i {
  position: absolute;
  width: 22px; height: 22px;
  border: 0 solid rgba(255,0,0,0.55);
}
.frame i:nth-child(1) { top: 0;    left: 0;  border-top-width: 1px; border-left-width: 1px; }
.frame i:nth-child(2) { top: 0;    right: 0; border-top-width: 1px; border-right-width: 1px; }
.frame i:nth-child(3) { bottom: 0; left: 0;  border-bottom-width: 1px; border-left-width: 1px; }
.frame i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }

/* ---- HUD readouts ------------------------------------------ */

.hud {
  position: absolute;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(224,224,224,0.42);
  white-space: nowrap;
  z-index: 3;
}
.hud .r { color: rgba(255,0,0,0.9); }
.hud-tl { top: calc(26px + env(safe-area-inset-top)); left: calc(30px + env(safe-area-inset-left)); }
.hud-tr { top: calc(26px + env(safe-area-inset-top)); right: calc(30px + env(safe-area-inset-right)); text-align: right; }
.hud-bl { bottom: calc(26px + env(safe-area-inset-bottom)); left: calc(30px + env(safe-area-inset-left)); }
.hud-br { bottom: calc(26px + env(safe-area-inset-bottom)); right: calc(30px + env(safe-area-inset-right)); text-align: right; }

@media (max-width: 560px) {
  .hud-tr, .hud-bl { display: none; }  /* keep phone corners quiet */
}

/* ---- globe -------------------------------------------------- */

.globe-wrap {
  position: relative;
  width: min(74vmin, 560px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
}

.globe { width: 100%; height: 100%; overflow: visible; }

.globe .shell   { stroke: rgba(255,0,0,0.50); }
.globe .lat     { stroke: rgba(255,0,0,0.22); }
.globe .mer     { stroke: rgba(255,0,0,0.30); }
.globe ellipse, .globe circle { fill: none; stroke-width: 1; vector-effect: non-scaling-stroke; }

/* meridians spin: scaleX ≈ cos(t), phase-staggered — a wireframe
   sphere rotating on its axis. Latitudes hold still (as they would). */
.globe .mer {
  transform-box: fill-box;
  transform-origin: center;
  animation: meridian 16s linear infinite;
}
.globe .mer.m2 { animation-delay: -2.667s; }
.globe .mer.m3 { animation-delay: -5.333s; }

@keyframes meridian {
  0%     { transform: scaleX(1); }
  12.5%  { transform: scaleX(0.707); }
  25%    { transform: scaleX(0); }
  37.5%  { transform: scaleX(-0.707); }
  50%    { transform: scaleX(-1); }
  62.5%  { transform: scaleX(-0.707); }
  75%    { transform: scaleX(0); }
  87.5%  { transform: scaleX(0.707); }
  100%   { transform: scaleX(1); }
}

/* origin beacon — the first node, pulsing */
.globe .node-core { fill: var(--red); }
.globe .node-ring {
  fill: none; stroke: var(--red); stroke-width: 1;
  transform-box: fill-box; transform-origin: center;
  animation: ping 2.8s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
}
@keyframes ping {
  0%   { transform: scale(0.3); opacity: 0.9; }
  70%  { transform: scale(2.6); opacity: 0; }
  100% { transform: scale(2.6); opacity: 0; }
}

/* ---- orbiting callsign -------------------------------------- */

.orbit-anchor {
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  pointer-events: none;
}
.orbit-label {
  position: absolute;
  font-size: 0.6rem;
  letter-spacing: 0.28em;
  color: rgba(255,0,0,0.85);
  text-shadow: 0 0 8px rgba(255,0,0,0.55);
  white-space: nowrap;
  offset-path: ellipse(56vmin 11vmin at 0 0);
  offset-rotate: 0deg;
  animation: orbit 36s linear infinite, orbit-depth 36s linear infinite;
}
@supports not (offset-path: ellipse(1px 1px at 0 0)) {
  .orbit-label { transform: translate(-50%, 14vmin); animation: none; }
}
@keyframes orbit {
  from { offset-distance: 0%; }
  to   { offset-distance: 100%; }
}
/* dips + dims on the far side of its pass */
@keyframes orbit-depth {
  0%, 40%, 100% { opacity: 0.9; }
  60%, 80%      { opacity: 0.28; }
}
@media (max-width: 560px) {
  .orbit-label { font-size: 0.54rem; offset-path: ellipse(44vmin 9vmin at 0 0); }
}

/* ---- center message ----------------------------------------- */

.msg {
  position: absolute;
  z-index: 2;
  text-align: center;
  padding: clamp(18px, 4vmin, 30px) clamp(22px, 5vmin, 44px);
  background: rgba(0,0,0,0.62);
  border: 1px solid rgba(255,0,0,0.18);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}

.msg h1 {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: clamp(1.05rem, 4.6vw, 1.75rem);
  letter-spacing: 0.34em;
  margin-right: -0.34em;   /* re-center tracked caps */
  color: var(--white);
  text-shadow: 0 0 22px rgba(255,0,0,0.28);
  white-space: nowrap;
}

/* trailing dots type themselves */
.msg h1 .dots {
  display: inline-block;
  overflow: hidden;
  vertical-align: bottom;
  white-space: nowrap;
  animation: dots 2.4s steps(4, jump-none) infinite;
}
@keyframes dots {
  from { width: 0; }
  to   { width: 1.9em; }
}

/* block cursor */
.msg h1 .cur {
  display: inline-block;
  width: 0.52em; height: 1em;
  margin-left: 0.14em;
  vertical-align: text-bottom;
  background: var(--red);
  box-shadow: 0 0 10px rgba(255,0,0,0.7);
  animation: blink 1.1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.msg .sub {
  display: inline-block;
  margin-top: 14px;
  font-size: clamp(0.58rem, 2.4vw, 0.72rem);
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: rgba(224,224,224,0.55);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,0,0,0.35);
  padding-bottom: 3px;
  transition: color 0.25s ease, border-color 0.25s ease, text-shadow 0.25s ease;
}
.msg .sub .r { color: rgba(255,0,0,0.9); }
.msg .sub:hover, .msg .sub:focus-visible {
  color: var(--white);
  border-color: var(--red);
  text-shadow: 0 0 12px rgba(255,0,0,0.45);
  outline: none;
}

/* phone: tighten tracking + padding so the nowrap headline always fits */
@media (max-width: 560px) {
  .msg { padding: 15px 16px 17px; max-width: calc(100vw - 36px); }
  .msg h1 { font-size: clamp(0.78rem, 3.7vw, 1.2rem); letter-spacing: 0.2em; margin-right: -0.2em; }
  .msg .sub { letter-spacing: 0.18em; }
}

/* ---- motion off ---------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .globe .mer, .globe .node-ring, .orbit-label,
  .msg h1 .dots, .msg h1 .cur { animation: none; }
  .msg h1 .dots { width: auto; }
  .orbit-label { offset-distance: 12%; opacity: 0.9; }
}
</style>
</head>
<body>

<main class="stage">

  <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <div class="hud hud-tl">ANALOGS.NETWORK</div>
  <div class="hud hud-tr">SYS <span class="r">//</span> PRE-INIT</div>
  <div class="hud hud-bl">NODES <span class="r">//</span> 000</div>
  <div class="hud hud-br">EST. 2026</div>

  <div class="globe-wrap" aria-hidden="true">
    <svg class="globe" viewBox="-110 -110 220 220" role="img" aria-label="Wireframe globe, awaiting nodes">
      <!-- shell -->
      <circle class="shell" r="100"/>
      <!-- latitudes (static under axial rotation) -->
      <ellipse class="lat" cy="0"     rx="100"  ry="28"/>
      <ellipse class="lat" cy="-50"   rx="86.6" ry="24"/>
      <ellipse class="lat" cy="50"    rx="86.6" ry="24"/>
      <ellipse class="lat" cy="-86.6" rx="50"   ry="13"/>
      <ellipse class="lat" cy="86.6"  rx="50"   ry="13"/>
      <!-- meridians (spinning) -->
      <ellipse class="mer m1" rx="100" ry="100"/>
      <ellipse class="mer m2" rx="100" ry="100"/>
      <ellipse class="mer m3" rx="100" ry="100"/>
      <!-- origin beacon: Oakland, roughly (kept clear of the center panel) -->
      <circle class="node-ring" cx="-55" cy="-48" r="6"/>
      <circle class="node-core" cx="-55" cy="-48" r="2.4"/>
    </svg>

    <span class="orbit-anchor" aria-hidden="true">
      <span class="orbit-label">OAKLENS.ART</span>
    </span>
  </div>

  <div class="msg">
    <h1>AWAITING NODES<span class="dots">...</span><span class="cur" aria-hidden="true"></span></h1>
    <a class="sub" href="https://os.oaklens.art" rel="noopener">
      CONNECTING WITH YOU SOON <span class="r">///</span>
    </a>
  </div>

</main>

</body>
</html>
